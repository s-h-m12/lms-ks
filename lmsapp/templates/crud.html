{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Добавление курса</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link href="{% static 'styles/styles.css' %}" rel="stylesheet">
    <link href="{% static 'styles/crud.css' %}" rel="stylesheet">
    <link href="{% static 'images/kialogo.ico' %}" rel="icon">
</head>
<body>
    <nav class="navbar navbar-expand shadow-sm">
        <div class="container-fluid">
            <a href="{% url 'home' %}" class="navbar-brand first-item"><img src="{% static 'images/kia-navlogo.png' %}"></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">Система обучения</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">Моё обучение</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">Курсы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">Статистика</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">ЛК</a>
                    </li>
                    <li class="nav-item last-item">
                        <a class="nav-link active" href="{% url 'logout' %}">Выйти</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <a href="{% url 'courses' %}" class="back-button">
            <span class="back-arrow">←</span> Назад
        </a>

        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Курс</h1>
                <button class="save-icon-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V7L17 3Z" fill="#9ACC39" stroke="#9ACC39" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 21V14H7V21" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 3V7H15" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <div class="form-fields">
                <div class="field-row">
                    <div class="field-group">
                        <label class="field-label">Название курса</label>
                        <input type="text" class="field-input" placeholder="Введите название курса">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Категория</label>
                        <select class="field-select">
                            <option>Программирование</option>
                            <option>Базы данных</option>
                            <option>Веб-разработка</option>
                            <option>Системное администрирование</option>
                            <option>Кибербезопасность</option>
                            <option>Управление проектами</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label class="field-label">Уровень</label>
                        <select class="field-select">
                            <option>Начальный</option>
                            <option>Средний</option>
                            <option>Продвинутый</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Длительность (часы)</label>
                        <input type="number" class="field-input" placeholder="0">
                    </div>
                </div>

                <div class="field-group full-width">
                    <label class="field-label">Статус</label>
                    <select class="field-select">
                        <option>Черновик</option>
                        <option>Опубликован</option>
                        <option>Архив</option>
                    </select>
                </div>
            </div>

            <div class="description-container">
                <h2 class="description-title">Описание курса</h2>
                <textarea class="description-textarea" placeholder="Введите описание курса..."></textarea>
            </div>

            <div class="image-container">
                <div class="image-preview">
                    <img src="{% static 'images/course-placeholder.png' %}" alt="Превью" class="preview-image">
                </div>
                <div class="image-upload">
                    <button class="upload-btn">Выбрать файл</button>
                    <p class="upload-hint">Форматы: PNG, JPG, JPEG<br>Макс. размер: 5 МБ</p>
                </div>
            </div>

            <div class="form-actions">
                <button class="cancel-btn">Отмена</button>
                <button class="save-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>
</body>
</html>
